:root{--primary-text:#fff;--wire:#8879da;--badge:#f3f4f8;--hover:#f8f7ff;--board:#fafaff;--grid:#d9d9ea;--node-line:#dce0ee;--node-shadow:#34406a12;--selection:#6052d626;--field:#f7f8fc;--ring:#6052d63b;--status-shadow:#34406a0d;--dialog-shadow:#20283a21;--backdrop:#232b4a50;}

body{font-family:system-ui,"Microsoft YaHei UI",sans-serif}
header{background:var(--panel);padding:16px clamp(16px,3vw,44px);gap:13px}
header b{background:var(--tint);color:var(--accent);border-radius:12px;padding:8px 12px}

header small{background:var(--badge);border-radius:7px;padding:4px 9px}
nav{background:var(--base);padding:14px clamp(12px,3vw,44px) 0;gap:8px}
nav button{background:transparent;border-color:transparent;border-radius:10px 10px 0 0}
nav .tab{border-radius:10px 10px 0 0}
nav .tab:has(.active),nav button.active{background:var(--tint);color:var(--accent)}
nav button.active{border-bottom:2px solid var(--accent);font-weight:650}

button,input,select{background:var(--panel)}
button:hover{background:var(--hover)}
.primary,.primary:hover{background:var(--accent);color:var(--primary-text);border-color:var(--accent)}
main>.toolbar{margin:0 clamp(12px,3vw,44px);padding:23px 0 15px;border:0}

.filters{gap:12px;margin-bottom:20px}

}

}

 .palette{width:220px;flex:0 0 220px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px}

:root{

function simulateInventory(tool,input){
  const schema=tool.contract.inputSchema;
  const fail=details=>({state:'参数错误',details});
  for(const key of schema.required||[]){
    if(input[key]===undefined||input[key]==='')return fail('缺少必填参数：'+key);
  }
  for(const [key,value] of Object.entries(input)){
    const rule=schema.properties?.[key];
    if(!rule)continue;
    let parsed=value;
    if(['number','integer','boolean','object','array'].includes(rule.type)&&typeof value==='string'){
      try{parsed=JSON.parse(value);}catch{return fail(key+' 需要 '+rule.type+' 格式。');}
    }
    const actual=Array.isArray(parsed)?'array':parsed===null?'null':typeof parsed;
    if(rule.type&&actual!==(rule.type==='integer'?'number':rule.type))return fail(key+' 需要 '+rule.type+' 类型。');
    if(rule.type==='integer'&&!Number.isInteger(parsed))return fail(key+' 必须是整数。');
    if(typeof parsed==='number'&&(parsed<(rule.minimum??-Infinity)||parsed>(rule.maximum??Infinity)))return fail(key+' 超出声明范围。');
    if(rule.enum&&!rule.enum.includes(parsed))return fail(key+' 不在允许值中。');
    input[key]=parsed;
  }
  if(tool.name==='image_view'){
    return {state:'成功',output:{placeholderImageId:'web-placeholder://comfy/1.9mb',summary:'模拟图像尺寸和坐标说明'},details:'图片端口使用网页占位图。路径作为模拟参数保留。'};
  }
  return {state:'成功',output:'网页模拟回执 · '+tool.name,details:'已校验已知参数并返回通用样例。'};
}

const DYNAMIC_TOOL_URL='/plugins/thinking-space/tools';
let dynamicToolCount=0;
function importDynamicTool(entry){
  const id=String(entry&&entry.name||'').trim();
  if(!id) return false;
  if(Object.hasOwn(whaleTools,id)){
    // 宿主实时有这个名字：用宿主声明覆盖旧快照的字段
    const cur=whaleTools[id],prev=cur.contract||{};
    cur.name=String(entry.displayName||cur.name||id);
    if(entry.plugin)cur.plugin=String(entry.plugin);
    if(entry.category)cur.category=String(entry.category);
    cur.contract={...prev,
      inputSchema:entry.inputSchema??prev.inputSchema??null,
      danger:String(entry.danger||prev.danger||'ask'),
      outputSchema:entry.outputSchema??prev.outputSchema??null,
      visibleInputs:Array.isArray(entry.visibleInputs)&&entry.visibleInputs.length?entry.visibleInputs:(prev.visibleInputs||[]),
      visibleOutputs:Array.isArray(entry.visibleOutputs)&&entry.visibleOutputs.length?entry.visibleOutputs:(prev.visibleOutputs||[]),
    };
    return false;
  }
  if(importedTools.has(id)) return false;
  if(tools.some(item=>item.id===id)) return false;
  const name=String(entry.displayName||id)||id;
  whaleTools[id]={
    id, name, plugin:String(entry.plugin||'外部'), category:String(entry.category||'工具'),
    whale:false, dynamic:true, output:'结果',
    contract:{
      inputSchema:entry.inputSchema||null, toolVersion:null,
      danger:String(entry.danger||'ask'),
      visibleInputs:Array.isArray(entry.visibleInputs)?entry.visibleInputs:[],
      outputSchema:entry.outputSchema||null,
      visibleOutputs:Array.isArray(entry.visibleOutputs)?entry.visibleOutputs:[],
    },
  };
  dynamicToolCount++;
  return true;
}
let syncingPluginLibrary=false;
async function syncPluginLibrary(options){
  const silent=!!(options&&options.silent);
  if(syncingPluginLibrary)return null;
  syncingPluginLibrary=true;
  let payload=null;
  try{
    const res=await fetch(DYNAMIC_TOOL_URL+'?t='+Date.now(),{credentials:'same-origin',cache:'no-store'});
    if(!res.ok)throw new Error('宿主返回 HTTP '+res.status);
    payload=await res.json();
  }catch(error){
    syncingPluginLibrary=false;
    const message=error instanceof Error?error.message:String(error);
    if(silent){console.info('画布工具目录：没读成 '+message);return null;}
    showDialog('同步插件库',`<p>没读成：${safe(message)}</p><p class="muted">宿主没给回音，检查 WhaleLife 是否在跑、thinking-space 插件是否还装着。</p><div class="actions">${closeButton}</div>`);
    return null;
  }
  syncingPluginLibrary=false;
  if(!payload||payload.ok!==true||!Array.isArray(payload.tools)){
    if(silent)return null;
    showDialog('同步插件库',`<p>宿主回来了，但没给工具列表${payload&&payload.error?'：'+safe(String(payload.error)):''}。</p><div class="actions">${closeButton}</div>`);
    return null;
  }
  const names=new Set(payload.tools.map(entry=>String(entry&&entry.name||'').trim()).filter(Boolean));
  let added=0,updated=0,removed=0;
  for(const entry of payload.tools){
    const id=String(entry&&entry.name||'').trim();
    if(!id)continue;
    const existed=Object.hasOwn(whaleTools,id)||importedTools.has(id);
    if(importDynamicTool(entry))added++;
    else if(existed)updated++;
  }
  for(const [id,tool] of Object.entries(whaleTools)){
    if(tool&&tool.dynamic&&!names.has(id)){delete whaleTools[id];removed++;}
  }
  dynamicToolCount=Object.values(whaleTools).filter(tool=>tool&&tool.dynamic).length;
  let flowReport=null;
  if(!silent){
    contractOnlyEntries.clear();library.hostOnly=true;library.mode='all';library.filter='';
    flowReport=await syncFlowsFromHost({silent:true});
  }
  try{render();}catch(error){}
  if(silent)return {total:names.size,added,updated,removed};
  let flowLine='';
  if(flowReport&&flowReport.ok&&flowReport.source==='host'){

function flowReferencePath(id,target,seen=new Set()){
  if(id===target)return [id];
  if(seen.has(id))return null;
  seen.add(id);
  for(const node of flows.find(flow=>flow.id===id)?.nodes||[]){
    if(!node.type.startsWith('function:'))continue;
    const path=flowReferencePath(node.type.slice(9),target,seen);
    if(path)return [id,...path];
  }
  return null;
}

function usageIndex(){

  const index=new Map();

    if(!node.type)return;
    const list=index.get(node.type);

const purposeOptions=[['','全部用途'],['input','输入'],['output','输出'],['event','事件'],['process','工具处理'],['complex','复杂工具']];

function nodePurposes(tool){
  if(!tool)return [];
  if(tool.functionRef)return flowPurposes(flows.find(flow=>flow.id===tool.functionRef));
  const groups=[];
  if(['message','input_text','qq_group_input'].includes(tool.id)||tool.category==='输入')groups.push('input');
  if(tool.id==='qq_group_input'||tool.category==='事件')groups.push('event');
  if(['reply','ticket','qq_group_output','display_text','display_image_placeholder','chime_test','archive_preview'].includes(tool.id)
    ||['动作','输出'].includes(tool.category)||['mouth_say','speak','qq_send_image','qq_send_meme'].includes(tool.name))groups.push('output');
  const metadata=contractFor(tool);
  for(const role of metadata?.roles||[]){
    const purpose=({input:'input',trigger:'event',process:'process',output:'output',action:'output'})[role];
    if(purpose&&!groups.includes(purpose))groups.push(purpose);
  }
  if(!groups.length)groups.push('process');
  const fields=tool.whale?Object.keys(whaleFieldsFor(tool)||{}):[];
  if(fields.length>=5||['comfy_generate','image_view','scribe_run','scribe_transcribe','deepclef_task','review_preview'].includes(tool.inventory?.record.toolName||tool.id))groups.push('complex');
  return groups;
}
function flowPurposes(flow,seen=new Set()){
  if(!flow||seen.has(flow.id))return [];
  seen.add(flow.id);
  const groups=new Set(flow.compound?['complex']:[]);
  for(const node of flow.nodes){
    const tool=getTool(node.type);
    const purposes=tool?.functionRef?flowPurposes(flows.find(item=>item.id===tool.functionRef),seen):nodePurposes(tool);
    for(const purpose of purposes)groups.add(purpose);
  }
  return [...groups];
}
const publishNonToolIds=new Set(['message','input_text','qq_group_input','reply','ticket','qq_group_output','display_text','display_image_placeholder','result_note','kan_prompt','kan_compose','archive_preview']);
let pendingPublish=null;
function publishParamName(base,used){
  let name=String(base||'entry').replace(/[^\p{L}\p{N}_-]/gu,'_');
  if(!/^[\p{L}_][\p{L}\p{N}_-]{0,63}$/u.test(name))name='entry';
  if(['__proto__','constructor','prototype'].includes(name))name='entry';
  let candidate=name,n=2;
  while(used.has(candidate)){candidate=name+n;n+=1;}
  used.add(candidate);
  return candidate;
}
function guessOutputPath(tool){
  const contract=tool?.contract||{};
  const schema=contract.outputSchema;
  const props=schema&&schema.properties?Object.keys(schema.properties):[];
  if(props.length===1)return props[0];
  const visible=Array.isArray(contract.visibleOutputs)?contract.visibleOutputs.filter(Boolean):[];
  if(visible.length===1)return String(visible[0]);
  return '';
}
function flowToSkillSpec(flow){
  const problems=[],refs=[];
  const byId=new Map(flow.nodes.map(node=>[node.id,node]));
  const toolOf=node=>node?getTool(node.type):undefined;
  const steps=[];
  for(const node of flow.nodes){
    const tool=toolOf(node);
    if(!tool){problems.push('节点「'+node.id+'」的类型 '+node.type+' 找不到对应工具。');continue;}
    if(publishNonToolIds.has(tool.id))continue;
    if(typeof node.type==='string'&&node.type.startsWith('function:')){
      problems.push('「'+tool.name+'」是引用的画布；技能里只装真正要调的工具，把它里面的工具节点搬过来再发布。');continue;
    }
    if(tool.dynamic!==true){
      problems.push('「'+tool.name+'」不在宿主工具目录里。先点工具栏的「同步插件库」，确认这个工具真的装着。');continue;
    }
    steps.push(node);
  }
  if(!steps.length)problems.push('这个画布里没有能发布成工具步骤的节点。');
  const stepIds=new Set(steps.map(node=>node.id));
  const edges=(Array.isArray(flow.edges)?flow.edges:[]).filter(edge=>Array.isArray(edge)&&stepIds.has(edge[0])&&stepIds.has(edge[1]));
  const incoming=new Map(),outgoing=new Map();
  for(const [from,to] of edges){
    if(!(incoming.get(to)||[]).includes(from))incoming.set(to,[...(incoming.get(to)||[]),from]);
    if(!(outgoing.get(from)||[]).includes(to))outgoing.set(from,[...(outgoing.get(from)||[]),to]);
  }
  for(const node of steps){
    const name=toolOf(node)?.name||node.id;
    if((incoming.get(node.id)||[]).length>1)problems.push('「'+name+'」上游接了多个节点，技能是一条链，接不了。');
    if((outgoing.get(node.id)||[]).length>1)problems.push('「'+name+'」后面接了多个节点，技能是一条链，接不了。');
  }
  const roots=steps.filter(node=>!(incoming.get(node.id)||[]).length);
  if(roots.length>1)problems.push('画布上有 '+roots.length+' 条各走各的链，技能只认一条。');
  const chain=[];
  if(roots.length===1){
    let cursor=roots[0].id,guard=0;
    while(cursor&&guard<steps.length+1){chain.push(cursor);cursor=(outgoing.get(cursor)||[])[0];guard+=1;}
  }
  if(chain.length&&chain.length!==steps.length)problems.push('有 '+(steps.length-chain.length)+' 个节点没接在这条链上。');
  const params=[],used=new Set();
  const chainSteps=chain.map(id=>{
    const node=byId.get(id),tool=toolOf(node),values={};
    for(const [key,value] of Object.entries(node.params||{})){
      if(typeof value==='string'&&value.trim().startsWith('$'))continue;
      if(value===undefined||value===null||value==='')continue;
      values[key]=value;
    }
    for(const [from,to,field] of edges){
      if(to!==id||!field)continue;
      const source=byId.get(from),sourceTool=toolOf(source);
      if(publishNonToolIds.has(sourceTool?.id)){
        const name=publishParamName(field,used);
        params.push({name,type:'string',required:true,label:String(field).slice(0,20)});
        values[field]='${'+name+'}';
        continue;
      }
      values[field]='${'+from+'}';
      refs.push({
        stepId:id,field,toolName:tool.name,
        fromId:from,fromToolName:sourceTool?.name||from,
        guess:guessOutputPath(sourceTool),
      });
    }
    return {id,tool:tool.name,plugin:tool.plugin||'',params:values,next:null};
  });
  for(let index=0;index<chainSteps.length;index+=1)chainSteps[index].next=index+1<chainSteps.length?chainSteps[index+1].id:null;
  const skillId=String(flow.id||'').replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,64)||'canvas-skill';
  const spec={
    schemaVersion:1,id:skillId,
    name:String(flow.name||skillId).slice(0,80),
    description:String(flow.note||('从画布发布：'+flow.name)).slice(0,500),
    kind:chainSteps.length>1?'composite':'single',
    params,steps:chainSteps,
  };
  return {ok:problems.length===0,problems,refs,spec};
}

}
async function confirmPublishToSpace(){
  if(!pendingPublish)return;
  const plan=pendingPublish;
  const spec=JSON.parse(JSON.stringify(plan.spec));
  const inputs=[...dialog.querySelectorAll('[data-ref-index]')];
  const status=dialog.querySelector('#publish-ref-status');
  const bad=[];
  for(const input of inputs){
    const ref=plan.refs[Number(input.dataset.refIndex)];
    if(!ref)continue;
    const path=String(input.value||'').trim();
    if(!path){bad.push('「'+ref.fromToolName+'」给「'+ref.field+'」的字段还没填');continue;}
    if(!/^[\p{L}\p{N}_-]+(?:\.[\p{L}_][\p{L}\p{N}_-]*|\[\d+\])+$/u.test(path)){bad.push('字段路径写法不对：'+path+'（要写成 data.text 这样）');continue;}
    const step=spec.steps.find(item=>item.id===ref.stepId);
    if(step)step.params[ref.field]='${'+ref.fromId+'.'+path+'}';
  }
  if(bad.length){
    if(status)status.textContent=bad.join('；');
    return;
  }
  const button=dialog.querySelector('[data-publish-confirm]');
  if(button){button.disabled=true;button.textContent='发布中…';}
  try{
    const res=await fetch('/plugins/thinking-space/publish',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({skill:spec})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.ok!==true)throw new Error(data.error||('宿主返回 HTTP '+res.status));
    pendingPublish=null;
    showDialog('发布到思维空间','<p>已'+(data.created?'新建':'覆盖')+'：'+safe(data.id)+' · revision '+safe(String(data.revision))+'。</p><p>去 <a href="/plugins/thinking-space/space" target="_blank" rel="noopener">思维空间的技能列表</a> 看一眼，或者让助手用 space_run 跑一次。</p><div class="actions">'+closeButton+'</div>');
  }catch(error){
    if(button){button.disabled=false;button.textContent='确认发布';}
    if(status)status.textContent='没发出去：'+String(error instanceof Error?error.message:error);
    else showDialog('发布到思维空间','<p>没发出去：'+safe(error instanceof Error?error.message:String(error))+'</p><p class="muted">技能库没变。改完再点一次发布。</p><div class="actions">'+closeButton+'</div>');
  }
}

function formValue(type,value){
  if(type==='string')return value;
  if(type==='number'||type==='integer'){
    const number=Number(value);
    if(!Number.isFinite(number)||(type==='integer'&&!Number.isInteger(number)))throw Error('请输入有效数字。');
    return number;
  }
  if(type==='boolean')return value==='true';
  const result=JSON.parse(value);
  if(type==='array'?!Array.isArray(result):!result||typeof result!=='object'||Array.isArray(result))throw Error('参数的 JSON 类型不符合声明。');
  return result;
}
function usesNodeValue(node,field){
  return field==='value'&&['input_text','qq_group_input','message'].includes(node?.type);

function useRunForm(flow,form,ports){

function validationIssues(flow){
  const byId=new Map(flow.nodes.map(node=>[node.id,node]));
  const problems=[];
  if(!flow.nodes.length)problems.push({message:'先添加一个节点。'});
  for(const node of flow.nodes){
    const tool=getTool(node.type);
    const links=flow.edges.filter(edge=>edge[1]===node.id);
    if(!tool){problems.push({nodeId:node.id,message:'工具不可用。'});continue;}
    const issue=whaleIssues(node,flow);
    if(issue)problems.push({nodeId:node.id,message:issue,invalidField:'url'});
    if(tool.functionRef){
      const nested=flows.find(item=>item.id===tool.functionRef);
      const path=nested&&flowReferencePath(nested.id,flow.id);
      if(!nested)problems.push({nodeId:node.id,message:'引用的功能不可用。'});
      else if(path)problems.push({nodeId:node.id,message:'功能引用形成循环：'+referenceNames([flow.id,...path])});
    }
    const has=field=>links.some(edge=>edge[2]===field)||!(node.params?.[field]===undefined||String(node.params[field]).trim()==='');
    const required=tool.contract?.inputSchema.required||
      ({kan_prompt:['message'],kan_compose:['prompt'],kan_vision:['image'],qq_group_output:['image','context']}[node.type]||[]);
    for(const field of required)if(!has(field))problems.push({nodeId:node.id,invalidField:field,message:'缺少'+(whaleFields[field]||field)+'。'});
    if(['qq_group_input','input_text','message'].includes(node.type)&&!String(node.value??tool.value??'').trim())
      problems.push({nodeId:node.id,invalidField:'value',message:'缺少'+tool.name+'。'});
    if(node.type==='surf_read'&&(has('url')||has('uri'))===has('pageRef'))problems.push({nodeId:node.id,invalidField:'url',message:'网页链接和页面引用需要二选一。'});
    if(!tool.whale&&tool.input&&!links.length&&!(node.type==='order'&&node.value))problems.push({nodeId:node.id,message:'缺少'+tool.input+'。'});
  }
  const visited=new Set(),visiting=new Set();
  function visit(id){
    if(visiting.has(id))return false;
    if(visited.has(id))return true;
    visiting.add(id);
    const pass=flow.edges.filter(edge=>edge[0]===id).every(edge=>visit(edge[1]));
    visiting.delete(id);visited.add(id);
    return pass;
  }
  if(!flow.nodes.every(node=>visit(node.id)))problems.push({message:'画布连线形成循环。'});
  for(const [from,to,field] of flow.edges){
    if(!byId.has(from)||!byId.has(to)){problems.push({message:'有连线指向已不存在的节点。'});continue;}
    if(!getTool(byId.get(from).type)||!getTool(byId.get(to).type))continue;
    const target=getTool(byId.get(to).type);
    if(field===undefined&&!target.whale)continue;
    if(!inputPorts(target).some(port=>port.field===field)){
      problems.push({nodeId:to,invalidField:field,message:'输入端口已不存在，请调整连线。'});
      continue;
    }
    const verdict=connectionVerdict(flow,from,to,field);
    if(verdict==='incompatible'||verdict==='adaptable')problems.push({
      nodeId:to,invalidField:field,message:verdict==='adaptable'?'搜索结果需要整理成提示词。':'连线与输入端口类型不匹配。',
      adapter:verdict==='adaptable'?{from,to,field}:undefined,
    });
  }
  return problems;
}

function flowExportBundle(flow){
  const included=new Map(), custom=new Map();
  function add(item){
    if(!item||included.has(item.id))return;
    included.set(item.id,{...structuredClone(item),publicPorts:exposedFlowPorts(item)});
    for(const node of item.nodes){
      if(node.type.startsWith('function:'))add(flows.find(flow=>flow.id===node.type.slice(9)));
      else if(tools.some(tool=>tool.id===node.type))custom.set(node.type,getTool(node.type));
    }
  }
  add(flow);
  return {schemaVersion:1,rootId:flow.id,flows:[...included.values()],tools:[...custom.values()]};
}
function downloadFlow(flow){

  const url=URL.createObjectURL(blob),link=document.createElement('a');

  link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

function importFlowBundle(value){
  const fail=message=>{throw Error(message);};
  const id=value=>typeof value==='string'&&/^[A-Za-z0-9_-]{1,80}$/.test(value);
  const nodeType=value=>typeof value==='string'&&/^(?:function:)?[A-Za-z0-9_-]{1,90}$/.test(value);
  const field=value=>typeof value==='string'&&/^[\w\u3400-\u9fff-]{1,64}$/.test(value)&&!['__proto__','constructor','prototype'].includes(value);
  const label=(value,size=40)=>typeof value==='string'?value.trim().slice(0,size):'';
  if(value?.schemaVersion!==1||!Array.isArray(value.flows)||!value.flows.length||value.flows.length>40)fail('仅支持版本 1 的工作流文件，单次最多 40 个功能。');
  const identifiers=new Map(), importedToolsMap=new Map();
  for(const item of value.flows){
    if(!id(item?.id)||identifiers.has(item.id))fail('流程标识无效或重复。');
    identifiers.set(item.id,crypto.randomUUID());
  }
  if(!identifiers.has(value.rootId))fail('文件缺少主工作流。');
  if(!Array.isArray(value.tools)||value.tools.length>100)fail('工具定义无效。');
  const newTools=[];
  for(const tool of value.tools){
    if(!id(tool?.id)||importedToolsMap.has(tool.id)||!label(tool.name))fail('工具标识或名称无效。');
    if(getTool(tool.id))continue;
    const fresh={id:crypto.randomUUID(),name:label(tool.name),plugin:label(tool.plugin)||'导入工具',category:label(tool.category)||'工具',input:label(tool.input),output:label(tool.output),parameter:label(tool.parameter),value:typeof tool.value==='string'?tool.value.slice(0,3000):undefined};
    importedToolsMap.set(tool.id,fresh.id);newTools.push(fresh);
  }
  const used=new Set(flows.map(flow=>flow.name.trim().normalize('NFKC').toLowerCase()));
  const newFlows=value.flows.map(item=>{
    const base=label(item.name);
    if(!base||!Array.isArray(item.nodes)||item.nodes.length>300||!Array.isArray(item.edges)||item.edges.length>1000)fail('流程名称、节点或连线无效。');
    let name=base,i=2;
    while(used.has(name.normalize('NFKC').toLowerCase())){const suffix=' '+i++;name=base.slice(0,40-suffix.length)+suffix;}
    used.add(name.normalize('NFKC').toLowerCase());
    const nodeIds=new Set();
    const nodes=item.nodes.map(node=>{
      if(!id(node?.id)||nodeIds.has(node.id)||!nodeType(node.type)||!Number.isFinite(node.x)||!Number.isFinite(node.y))fail('节点标识或坐标无效。');
      nodeIds.add(node.id);
      let type=importedToolsMap.get(node.type)||node.type;
      if(type.startsWith('function:')){
        const target=identifiers.get(type.slice(9));
        if(!target||!item.compound)fail('文件缺少引用功能，或独立功能包含引用。');
        type='function:'+target;
      }else if(!getTool(type)&&!newTools.some(tool=>tool.id===type))fail('缺少节点类型：'+type);
      const params=Object.fromEntries(Object.entries(node.params||{}).filter(([key])=>field(key)));
      return {id:node.id,type,x:Math.max(0,Math.min(6000,node.x)),y:Math.max(0,Math.min(6000,node.y)),params,value:typeof node.value==='string'?node.value.slice(0,3000):undefined,note:label(node.note,3000)};
    });
    const edges=item.edges.map(edge=>{
      if(!Array.isArray(edge)||edge.length<2||edge.length>3||!nodeIds.has(edge[0])||!nodeIds.has(edge[1])||(edge.length===3&&!field(edge[2])))fail('连线端口无效。');
      return edge;
    });
    const ports=item.publicPorts;
    const cleanPorts=(items,input)=>Array.isArray(items)?items.slice(0,300).flatMap(port=>{
      if(!nodeIds.has(port?.nodeId)||!label(port.label)||input&&!field(port.field))return [];
      return [{nodeId:port.nodeId,label:label(port.label),...(input?{field:port.field,type:['string','number','integer','boolean','object','array'].includes(port.type)?port.type:'string',required:port.required===true}:{})}];
    }):[];
    return {id:identifiers.get(item.id),name,compound:item.compound===true,nodes,edges,publicPorts:ports?{inputs:cleanPorts(ports.inputs,true),outputs:cleanPorts(ports.outputs,false)}:undefined};
  });
  const stack=new Set(),finished=new Set(),byId=new Map(newFlows.map(flow=>[flow.id,flow]));
  function visit(id){
    if(stack.has(id))fail('文件包含循环功能引用。');
    if(finished.has(id))return;
    stack.add(id);
    for(const node of byId.get(id).nodes)if(node.type.startsWith('function:'))visit(node.type.slice(9));
    stack.delete(id);finished.add(id);
  }
  newFlows.forEach(flow=>visit(flow.id));
  return {newFlows,newTools,rootId:identifiers.get(value.rootId)};
}

async function pollServerSnapshot(){
  if(document.hidden)return;
  let data=null;
  try{
    const res=await fetch('/plugins/thinking-space/flows?t='+Date.now(),{credentials:'same-origin',cache:'no-store'});
    if(!res.ok)return;
    data=await res.json();
  }catch{return;}
  if(!data||data.ok!==true)return;
  const at=typeof data.savedAt==='string'?data.savedAt:'';
  if(!at)return;
  if(serverSeenAt===null){serverSeenAt=at;return;}
  if(at===serverSeenAt)return;
  serverSeenAt=at;
  const mine=localSnapshotAt();
  if(mine&&at<=mine)return; /* 这就是我们自己刚存上去的那份 */
  if(lastPushedAt&&at<=lastPushedAt)return; /* 自动保存推上去的那一版，不是别人的改动 */
  if(remoteConflict&&remoteConflict.at===at)return; /* 同一条已经提示过，不再刷 */
  if(sameProject(data.snapshot&&data.snapshot.project)){clearRemoteBanner();remoteConflict=null;return;} /* 时间戳变了但内容一样 */
  if(canvasIsClean()){
    if(!adoptServerSnapshot(data.snapshot))console.info('服务端有新快照，但读不出 project，保持当前画布。');
    return;
  }
  remoteConflict={at,snapshot:data.snapshot};
  showRemoteBanner(data.snapshot,at);
}

function replaceProject(snapshot){
  const project=snapshot?.project;
  const id=value=>typeof value==='string'&&/^(?!constructor$|prototype$|__proto__$)[\w-]{1,100}$/.test(value);
  const record=value=>value&&typeof value==='object'&&!Array.isArray(value);
  const nodeType=value=>typeof value==='string'&&(value.startsWith('function:')?id(value.slice(9)):id(value));
  const validFlow=flow=>id(flow?.id)&&typeof flow.name==='string'&&Array.isArray(flow.nodes)&&Array.isArray(flow.edges)&&
    new Set(flow.nodes.map(node=>node?.id)).size===flow.nodes.length&&
    flow.nodes.every(node=>id(node?.id)&&nodeType(node.type)&&Number.isFinite(node.x)&&Number.isFinite(node.y))&&
    flow.edges.every(edge=>Array.isArray(edge)&&edge.length>=2&&id(edge[0])&&id(edge[1])&&
      (edge[2]==null||/^[\w\u3400-\u9fff-]+$/.test(edge[2])));
  if(snapshot?.kind!=='whalelife-project'||snapshot.schemaVersion!==1||!Array.isArray(project?.flows)||!project.flows.every(validFlow)||
    new Set(project.flows.map(flow=>flow.id)).size!==project.flows.length||!Array.isArray(project.tools)||!project.tools.every(tool=>id(tool?.id)&&typeof tool.name==='string')||
    !Array.isArray(project.open)||!project.open.every(id)||!Array.isArray(project.recentFlows)||!project.recentFlows.every(id)||
    !record(project.projectViews)||!Object.entries(project.projectViews).every(([flowId,view])=>id(flowId)&&record(view)&&
      (view.zoom===undefined||(Number.isFinite(view.zoom)&&view.zoom>=.01&&view.zoom<=2)))||
    !record(project.detailTabs)||!Object.entries(project.detailTabs).every(([route,detail])=>id(detail?.flow)&&id(detail?.node)&&route==='detail:'+detail.flow+':'+detail.node)||
    !record(project.workflowRevisions)||!Object.values(project.workflowRevisions).every(entries=>Array.isArray(entries)&&entries.every(entry=>validFlow(entry?.snapshot))))
    throw Error('工程文件格式无效。');
  localStorage.setItem(key,JSON.stringify(project));

}

const toolLibraryModes=[['all','所有工具'],['plugin','按插件分类'],['purpose','按功能分类'],['tag','按任务标签'],['interface','按接口类型']];
function libraryPlugin(tool){
  if(tool.contractEntry)return tool.contractEntry.plugin;
  return tool.contract?.plugin||Object.entries(whalePlugins).find(([,name])=>name===tool.plugin)?.[0]||tool.plugin;

function libraryInterface(tool){
  if(tool.contractEntry)return ({tool:"工具",event:"事件",service:"插件服务",settings:"设置页"})[tool.contractEntry.kind]||"工具";
  return tool.inventory?.type||(tool.id==='qq_group_input'||tool.category==='事件'?'事件':'工具');

function libraryToolPurposes(tool){
  const type=libraryInterface(tool);
  if(type==='事件'||type==='内部通道')return ['event',...(tool.inventory?[]:nodePurposes(tool))];
  return type==='工具'?nodePurposes(tool):[];

function matchesLibraryMode(tool,mode,filter){
  const type=libraryInterface(tool);
  if(mode==='all')return type==='工具';
  if(mode==='plugin')return !filter||libraryPlugin(tool)===filter;
  if(mode==='tag'){
    const tags=contractFor(tool)?.tags||[];
    return filter?tags.includes(filter):tags.length>0;
  }
  if(mode==='purpose'){
    const purposes=libraryToolPurposes(tool);
    return filter?purposes.includes(filter):purposes.length>0;
  }
  return !filter||type===filter;
}

function skillToFlow(skill){
  const steps=Array.isArray(skill&&skill.steps)?skill.steps:[];
  if(!steps.length)return null;
  const refMap={};
  steps.forEach((step,k)=>{if(step&&step.id!=null)refMap[String(step.id)]='n'+k;});
  const remapRefs=v=>{
    if(typeof v==='string'){
      return v.replace(/\$\{([^}.\s]+)\./g,(m,key)=>refMap[key]?('${'+refMap[key]+'.'):m)
              .replace(/\$\{([^}\s]+)\}/g,(m,key)=>refMap[key]?('${'+refMap[key]+'}'):m);
    }
    if(Array.isArray(v))return v.map(remapRefs);
    if(v&&typeof v==='object'){const out={};for(const k of Object.keys(v))out[k]=remapRefs(v[k]);return out;}
    return v;
  };
  const missing=[];
  const nodes=steps.map((step,k)=>{
    const type=String(step&&step.tool||'').trim();
    if(type&&!getTool(type)&&!Object.hasOwn(whaleTools,type)&&!importedTools.has(type)&&!tools.some(item=>item.id===type)){
      // 写进工程本身的工具列表，刷新后节点还认得它；同步插件库时宿主真装了就换成真的。
      tools.push({id:type,name:type,plugin:String(step.plugin||'未登记'),category:'工具',placeholder:true,output:'结果'});
      missing.push(type);
    }
    return {id:'n'+k,type,x:36+k*216,y:92+(k%2)*105,params:remapRefs(step&&step.params||{})};
  });
  const index=new Map(steps.map((step,k)=>[step&&step.id,k]));
  const edges=[];
  steps.forEach((step,k)=>{
    if(step&&step.next!=null&&index.has(step.next))edges.push(['n'+k,'n'+index.get(step.next),'after']);
  });
  let refCount=0;
  for(const node of nodes){
    const serialized=JSON.stringify(node.params||{});
    refCount+=(serialized.match(/\$\{n\d[\w.\[\]]*\}/g)||[]).length;
  }
  const flow={
    id:crypto.randomUUID(),
    name:uniqueCanvasName(String(skill.name||skill.id||'技能')),
    nodes,edges,
    compound:skill.kind==='composite',
    skillId:String(skill.id||''),
    skillRevision:Number(skill.revision||0),
    skillSyncedAt:new Date().toISOString(),
  };
  return {flow,missing,refCount};
}
async function openSkillInCanvas(skillId){
  const id=String(skillId||'').trim();
  if(!id)return {ok:false,message:'缺少技能 id'};
  const existing=flows.find(flow=>flow.skillId===id);
  if(existing){
    openFlowCanvas(existing.id);
    showDialog('打开画布',`<p>「${safe(existing.name)}」已经在画布上了。</p><p class="muted">一条技能只画一次。要在它基础上做变体，用画布的「保存画布 · 新建功能」复制一份。</p><div class="actions">${closeButton}</div>`);
    return {ok:true,flowId:existing.id,reused:true};
  }
  let skill=null;
  try{
    const res=await fetch('/plugins/thinking-space/skill?id='+encodeURIComponent(id)+'&t='+Date.now(),{credentials:'same-origin',cache:'no-store'});
    if(!res.ok)throw new Error('宿主返回 HTTP '+res.status);
    const payload=await res.json();
    skill=payload&&payload.skill;
    if(!skill)throw new Error(payload&&payload.error?String(payload.error):'没拿到技能定义');
  }catch(error){
    const message=error instanceof Error?error.message:String(error);
    showDialog('打开画布',`<p>没读成这条技能：${safe(message)}</p><p class="muted">检查 WhaleLife 是否在跑、thinking-space 插件是否还装着。</p><div class="actions">${closeButton}</div>`);

  }
  const built=skillToFlow(skill);
  if(!built){
    showDialog('打开画布',`<p>这条技能没有步骤，画布上没东西可画。</p><div class="actions">${closeButton}</div>`);
    return {ok:false,message:'技能没有步骤'};
  }
  const {flow,missing,refCount}=built;
  flows.push(flow);open.push(flow.id);saveWorkflowRevision(flow);
  if(!persist()){
    flows.pop();open.pop();delete workflowRevisions[flow.id];
    showDialog('打开画布',`<p>浏览器未能保存画布。</p><div class="actions">${closeButton}</div>`);
    return {ok:false,message:'浏览器未能保存'};
  }
  changeTab(flow.id);
  const lineRef=refCount?`其中 ${refCount} 处参数引用了上游步骤`:'参数里没有跨步骤引用';
  const missingLine=missing.length
    ? `<p>这些工具画布上还没有，先按占位节点放着：${missing.map(name=>'<code>'+safe(name)+'</code>').join('、')}。</p><p class="muted">点工具库的「同步插件库」，宿主装了对应插件就会补上端口和参数。</p>`
    : '';
  showDialog('打开画布',`<p>已画出 ${flow.nodes.length} 个节点、${flow.edges.length} 条连线，${lineRef}。</p>${missingLine}<p class="muted">这是技能定义的一次性展开：之后在画布上改，不会写回宿主技能库；要回写，用「发布到思维空间」。</p><div class="actions">${closeButton}</div>`);
  return {ok:true,flowId:flow.id,missing,refCount};
}

function canvasNameTaken(name,exceptId){
  const normalized=name.trim().normalize('NFKC').toLowerCase();
  return flows.some(flow=>flow.id!==exceptId&&flow.name.trim().normalize('NFKC').toLowerCase()===normalized);
}
function uniqueCanvasName(base){
  let name=base;
  for(let number=2;canvasNameTaken(name);number++){
    const suffix=' '+number;
    name=base.slice(0,40-suffix.length)+suffix;
  }
  return name;
}
function showCanvasSave(flow){
  const libraryName=flow.compound?'复合功能库':'功能库';
  showDialog('保存画布',`<form id="save-canvas" class="dialog-grid">
    <label>功能名称<input name="name" required maxlength="40" value="${safe(flow.name)}"></label>
    <small>保存到${libraryName}。新建功能会复制当前节点、参数和连线。</small>
    <p id="canvas-save-status" role="status" hidden></p>
    <div class="actions"><button type="button" data-action="flow-versions">版本</button><button type="button" data-action="export-flow">导出 JSON</button><button type="button" data-action="dismiss">取消</button>
    <button type="submit" value="new">新建功能</button><button type="submit" value="save" class="primary">保存</button></div>
  </form>`);
}
function submitCanvasSave(form,copy){
  const flow=getFlow(), nameInput=form.elements.namedItem('name'), name=nameInput.value.trim();
  const status=form.querySelector('#canvas-save-status');
  const message=text=>{status.hidden=false;status.textContent=text;};
  if(!name){message('请填写功能名称。');nameInput.focus();return;}
  if(canvasNameTaken(name,copy?undefined:flow.id)){
    if(copy)nameInput.value=uniqueCanvasName(name);
    message(copy?'这个名称已存在。已填入可用名称，确认后再点「新建功能」。':'已有同名功能。要保留两份，可以改名并点「新建功能」。');
    nameInput.focus();nameInput.select();
    return;
  }
  if(copy){
    const created=structuredClone(flow);
    created.id=crypto.randomUUID();created.name=name;
    delete created.catalogCode;
    const previous=active;
    flows.push(created);open.push(created.id);active=created.id;saveWorkflowRevision(created);
    if(!persist()){
      flows.pop();open.pop();active=previous;delete workflowRevisions[created.id];
      message('浏览器未能保存画布。');return;
    }
    (views[created.id]??={}).status='已新建并保存画布';
    dialog.close();changeTab(created.id);return;
  }
  const previousName=flow.name,previousRevisions=workflowRevisions[flow.id]?.slice();
  flow.name=name;
  saveWorkflowRevision(flow);
  if(!persist()){
    flow.name=previousName;
    if(previousRevisions)workflowRevisions[flow.id]=previousRevisions;else delete workflowRevisions[flow.id];
    message('浏览器未能保存画布。');return;
  }
  views[flow.id].status='画布已保存';
  dialog.close();render();
}
const closeButton='<button type="button" data-action="dismiss">关闭</button>';
function addNode(type,x,y,connection){
  const flow=getFlow(), viewport=main.querySelector('.viewport');
  if(!viewport||!canAddPaletteNode(getTool(type),flow))return;
  rememberCanvas(flow);
  const zoom=boardZoom(viewport.querySelector('.board'));
  const node=makeNode(type,Math.max(12,x??viewport.scrollLeft/zoom+45),Math.max(12,y??viewport.scrollTop/zoom+45+flow.nodes.length*18));
  flow.nodes.push(node);
  if(connection){connect(connection.from,node.id,connection.input,undefined,true);return;}
  persist();renderEditor();
}
let pendingAdapter=null;
function connect(from,to,input,old,historySaved=false){
  const flow=getFlow(),view=views[flow.id];
  const seen=new Set();
  function reachesSource(id){
    if(id===from)return true;
    if(seen.has(id))return false;
    seen.add(id);
    return flow.edges.some(edge=>edge!==old&&edge[0]===id&&reachesSource(edge[1]));
  }
  const verdict=connectionVerdict(flow,from,to,input);
  if(reachesSource(to)){view.status='这条连线会形成循环。';}
  else if(verdict==='adaptable'){
    pendingAdapter={flowId:flow.id,from,to,input,old};
    showDialog('需要整理成提示词',`<p>搜索结果包含多条资料，出图节点需要一段提示词。</p>
      <div class="actions">${closeButton}<button type="button" data-action="insert-adapter">插入「整理提示词」</button></div>`);
  }else if(verdict==='incompatible'){
    view.status=connectionReason(flow,from,to,input);
  }else{
    if(!historySaved)rememberCanvas(flow);
    flow.edges=flow.edges.filter(edge=>edge!==old&&(edge[1]!==to||edge[2]!==input));
    flow.edges.push(input?[from,to,input]:[from,to]);
    view.status=verdict==='unknown'?'已连接 · 兼容性待确认，请试跑检查。':'已连接。';persist();
  }
  view.pending=null;view.portFilter=null;renderEditor();
}
function insertSearchAdapter(){
  const draft=pendingAdapter,flow=getFlow();
  if(!draft||draft.flowId!==flow?.id)return;
  const source=flow.nodes.find(node=>node.id===draft.from),target=flow.nodes.find(node=>node.id===draft.to);
  if(!source||!target)return;
  rememberCanvas(flow);
  const node=makeNode('search_prompt_adapter',Math.round((source.x+target.x)/2),Math.max(source.y,target.y)+185);
  flow.nodes.push(node);
  flow.edges=flow.edges.filter(edge=>edge!==draft.old&&(edge[1]!==draft.to||edge[2]!==draft.input));
  flow.edges.push([draft.from,node.id,'research'],[node.id,draft.to,draft.input]);
  pendingAdapter=null;dialog.close();
  views[flow.id].status='已插入整理提示词节点。';persist();renderEditor();
}
function run(flow,view){
  flow=consumeChatRunInput(flow,view,view.chatRunInput?structuredClone(flow):flow);
  const results=[], values=new Map();
  function evaluate(node){
    if(values.has(node.id))return values.get(node.id);
    const tool=getTool(node.type), upstream=flow.edges.find(([,to])=>to===node.id);
    const input=upstream?evaluate(flow.nodes.find(item=>item.id===upstream[0])):undefined;
    const parameter=node.value??tool.value;
    let output;
    if(tool.input&&!input&&!(tool.id==='order'&&parameter))output='';
    else switch(tool.id){
      case 'message':output=parameter;break;
      case 'extract':output=input.match(/\b[A-Z]?\d{3,}\b/i)?.[0]||'';break;
      case 'order':output=`订单 ${input||parameter} 已发货`;break;
      case 'summary':output=`模拟摘要：${input.slice(0,45)}（${parameter}）`;break;
      case 'ticket':output='模拟工单 TK-001';break;
      case 'reply':output=input;break;
      default:output=`模拟${tool.output||'结果'}：${input||'已执行'}`;
    }
    values.set(node.id,output);
    results.push({nodeId:node.id,state:output?'成功':'已跳过',name:tool.name,value:`输入：${input||'—'}\n结果：${output||'缺少输入或未得到结果'}`});
    return output;
  }
  flow.nodes.forEach(evaluate);
  view.results=results.length?results:[{name:'空流程',value:'先添加一个工具。'}];
  view.panel='run';view.status='模拟运行完成';renderEditor();
}

function beginPaletteDrag(event){
  const card=event.target.closest('.palette-card[data-drag-tool]');
  if(!card||event.button!==0||event.target.closest('button'))return false;
  const tool=getTool(card.dataset.tool);
  const viewport=main.querySelector('.viewport');
  const board=viewport?.querySelector('.board');
  if(!board||!canAddPaletteNode(tool,getFlow()))return false;
  event.preventDefault();
  let preview;
  const zoom=boardZoom(board);
  const hitBoard=pointer=>document.elementFromPoint(pointer.clientX,pointer.clientY)?.closest('.board')===board;
  const offsetX=26,offsetY=16;
  const placement=pointer=>{
    const bounds=board.getBoundingClientRect();
    return {
      bounds,
      x:Math.max(12,Math.round((pointer.clientX-offsetX-bounds.left)/zoom)),
      y:Math.max(12,Math.round((pointer.clientY-offsetY-bounds.top)/zoom)),
    };
  };
  card.setPointerCapture(event.pointerId);
  card.onpointermove=move=>{
    if(!preview){
      if(Math.hypot(move.clientX-event.clientX,move.clientY-event.clientY)<5)return;
      preview=document.createElement('div');
      preview.className='palette-drag-preview';
      preview.setAttribute('aria-hidden','true');
      preview.inert=true;
      preview.style.transformOrigin='top left';
      preview.style.transform=`scale(${zoom})`;
      preview.innerHTML=nodeMarkup(makeNode(tool.id,0,0),{});
      document.body.append(preview);
    }
    const overCanvas=hitBoard(move);
    const {bounds,x,y}=placement(move);
    preview.style.left=(overCanvas?bounds.left+x*zoom:move.clientX-offsetX)+'px';
    preview.style.top=(overCanvas?bounds.top+y*zoom:move.clientY-offsetY)+'px';
    preview.classList.toggle('over-canvas',overCanvas);
    viewport.classList.toggle('palette-drop-target',overCanvas);
  };
  const clear=()=>{
    preview?.remove();preview=null;
    viewport.classList.remove('palette-drop-target');
    card.onpointermove=null;card.onpointerup=null;card.onlostpointercapture=null;
  };
  card.onpointerup=up=>{
    const dropped=Boolean(preview&&hitBoard(up));
    clear();
    if(!dropped)return;
    const {x,y}=placement(up);
    addNode(tool.id,x,y);
  };
  card.onlostpointercapture=clear;
  return true;
}
main.addEventListener('pointerdown',event=>{
  if(beginPaletteDrag(event))return;
  const port=event.target.closest('.port');
  if(port&&event.button===0&&!port.disabled){
    const node=port.closest('[data-node]').dataset.node;
    const board=main.querySelector('.board');
    const old=port.dataset.port==='in'?getFlow().edges.find(([,to,key])=>to===node&&key===port.dataset.field):null;
    if(port.dataset.port==='in'&&!old)return;
    wireDrag={from:old?.[0]||node,old,x:event.clientX,y:event.clientY,moved:false};
    port.setPointerCapture(event.pointerId);
    port.onpointermove=move=>{
      if(!wireDrag)return;
      if(!wireDrag.moved&&Math.hypot(move.clientX-event.clientX,move.clientY-event.clientY)<5)return;
      if(!wireDrag.moved&&board)updateWireTargets(board,getFlow(),wireDrag.from);
      Object.assign(wireDrag,{x:move.clientX,y:move.clientY,moved:true});
      draw();
    };
    port.onpointerup=up=>{
      const drag=wireDrag;wireDrag=null;

    return {flow:flow.id,conflict:true,currentRev,touched:[]};
  if(patch.preview===true)
    return {flow:flow.id,touched:dryRunPatch(JSON.parse(JSON.stringify(flow)),patch),preview:true,rev:currentRev};

    for(const item of patch.set){
      const node=flow.nodes.find(entry=>entry.id===item?.node);
      if(!node||!item.params||typeof item.params!=='object')continue;
      const beforeParams={...(node.params||{})};
      node.params={...(node.params||{}),...item.params};
      const fields=Object.keys(item.params);
      if(!fields.length)touched.push('参数 '+node.id);
      for(const field of fields){
        touched.push('参数 '+node.id+'.'+field+'：'+briefValue(beforeParams[field])+' → '+briefValue(item.params[field]));

function wishDraftFromReply(text,kind){

  if(!result||result.kind!==kind||typeof result.name!=='string'||!result.name.trim()||result.name.trim().length>40)return null;
  const name=result.name.trim();
  if(kind==='event'||kind==='tool'){
    const label=value=>typeof value==='string'?value.trim().slice(0,32):'';
    return {kind,name,input:label(result.input),output:label(result.output)||'模拟结果'};
  }
  if(!Array.isArray(result.steps)||!result.steps.length||result.steps.length>8)return null;
  const steps=[];
  for(const item of result.steps){
    if(!item||typeof item.type!=='string')return null;
    const tool=getTool(item.type);
    if(!tool||(tool.functionRef&&kind!=='compound'))return null;
    const ports=inputPorts(tool);
    const link=typeof item.link==='string'?item.link:null;
    const port=link==='default'?ports.find(port=>port.field===undefined):ports.find(port=>port.field===link);
    if(link&&(!steps.length||!port||!matchingPort(outputPort(getTool(steps.at(-1).type)),port)))return null;
    const params=Object.fromEntries(ports.flatMap(({field})=>{
      if(!field||!item.params||!Object.hasOwn(item.params,field))return [];
      const value=item.params[field];
      return ['string','number','boolean'].includes(typeof value)&&JSON.stringify(value).length<=1500?[[field,value]]:[];
    }));
    const value=typeof item.value==='string'?item.value.slice(0,1500):undefined;
    steps.push({type:tool.id,link,params,value});
  }
  return {kind,name,steps};
}

    catch(error){if(error.status===401)return;throw error;}
    if(!session||typeof session.id!=='string'||!session.id)return;
    const page=await wishRequest('/api/session?id='+encodeURIComponent(session.id)+'&limit=2');
    const rows=Array.isArray(page.items)?page.items:[];
    let synced=0;
    for(const row of rows){
      const text=String(row.text||'').trim();
      if(!text)continue;
      wishMessages.push({role:row.role==='user'?'user':'assistant',text,synced:true});
      synced+=1;

async function wishAgent(text,kind,onChunk){
  let session;
  const passwordRow=wishPanel.querySelector('#wish-password-row');
  const passwordInput=wishPanel.querySelector('#wish-password');
  try{session=await wishRequest('/api/session/current');}
  catch(error){
    if(error.status!==401)throw error;
    const password=passwordInput.value;
    passwordInput.value='';
    try{
      await wishRequest('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
    }catch(loginError){
      if(loginError.status!==401)throw loginError;
      passwordRow.hidden=false;
      if(!wishPanel.hidden)passwordInput.focus();
      throw Error(password?'控制台密码不正确，请重新输入后发送。':'请输入 WhaleLife 控制台密码，再点发送。');
    }
    session=await wishRequest('/api/session/current');
  }
  passwordInput.value='';passwordRow.hidden=true;
  if(typeof session.id!=='string'||!session.id)throw Error('WhaleLife 没有返回当前会话。');
  void refreshRobotIdentity();
  return new Promise((resolve,reject)=>{
    const socket=new WebSocket(location.origin.replace(/^http/,'ws')+'/ws/chat');
    let reply='',settled=false,lastAt=Date.now(),probing=false,misses=0;
    const IDLE_PROBE_MS=20000,TOTAL_LIMIT_MS=30*60*1000;
    let probeTimer=null,totalTimer=null;
    const stopTimers=()=>{if(probeTimer)clearInterval(probeTimer);if(totalTimer)clearTimeout(totalTimer);};
    const finish=(error)=>{if(settled)return;settled=true;stopTimers();try{socket.close();}catch{}if(error)reject(error);else resolve(reply);};
    // 等的时候只探活，不掐断：宿主跑长工具时可能几分钟没有新内容，那不算断线。
    const probeHost=async()=>{
      try{
        const response=await fetch('/api/status?t='+Date.now(),{credentials:'same-origin',cache:'no-store'});
        return response.ok;
      }catch{return false;}
    };
    const probe=async()=>{
      if(settled||probing)return;
      if(Date.now()-lastAt<IDLE_PROBE_MS)return;
      probing=true;
      const alive=await probeHost();
      probing=false;
      if(settled)return;
      misses=alive?0:misses+1;
      if(misses>=2)finish(new Error('宿主连续两次没应答，先断开。任务可能还在宿主那边跑，结果以插件回执为准。'));
    };
    probeTimer=setInterval(()=>{void probe();},IDLE_PROBE_MS);
    totalTimer=setTimeout(()=>finish(new Error('等了 30 分钟还没结束，先断开。宿主那边的任务可能还在跑，画布可以稍后重试。')),TOTAL_LIMIT_MS);
    socket.onopen=()=>socket.send(JSON.stringify({session:session.id,expectedSession:session.id,text:wishInstruction(text,kind)}));
    socket.onmessage=event=>{
      let data;
      try{data=JSON.parse(event.data);}catch{return;}
      lastAt=Date.now();misses=0;
      if(data.type==='chunk'&&typeof data.text==='string'){reply+=data.text;onChunk(reply);}
      else if(data.type==='context'&&data.personaName)updateRobotHeading(data.personaName);
      else if(data.type==='done')finish();
      else if(data.type==='error')finish(new Error(data.error||'助手回复失败。'));
    };
    socket.onclose=async()=>{
      if(settled)return;
      const alive=await probeHost();
      if(settled)return;
      finish(new Error(alive
        ?'连接被关了，但宿主还应答着：可能是别的窗口在聊，或者插件刚重载过。可以再发一次。'
        :'连接断了，宿主也没应答。先查 WhaleLife 是不是停了。'));
    };
    socket.onerror=()=>{};
  });
}
function richLinkify(text){
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const links=[];
  const replaced=String(text).replace(/https?:\/\/[^\s<>"'`]+/g,url=>{
    const clean=url.replace(/[.,;:!?)\]]+$/,'');
    const tail=url.slice(clean.length);
    let attr='';
    try{
      const parsed=new URL(clean);
      if(parsed.searchParams.get('inject')||parsed.searchParams.get('flow')||parsed.searchParams.get('skill'))attr=' data-canvas-link="1"';
    }catch{}
    links.push('<a href="'+esc(clean)+'"'+attr+' rel="noopener">'+esc(clean)+'</a>'+esc(tail));
    return '\u0000'+String(links.length-1)+'\u0000';
  });
  return esc(replaced).replace(/\u0000(\d+)\u0000/g,(_,i)=>links[Number(i)]);
}
function cardify(raw){
  const cards=[];
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const out=String(raw).replace(/\[\[skill:([A-Za-z0-9_-]+)(?:\|([^\]|]*))?(?:\|([^\]]*))?\]\]/g,(_,id,title,desc)=>{
    const html='<button type="button" class="wish-card" data-skill-card="'+esc(id)+'">'+
      '<span class="wish-card-title">'+esc((title||id).trim())+'</span>'+
      (desc&&desc.trim()?'<span class="wish-card-desc">'+esc(desc.trim())+'</span>':'')+
      '<span class="wish-card-go">\u5728\u753b\u5e03\u4e2d\u67e5\u770b \u203a<\/span>'+
    '</button>';
    cards.push(html);
    return '\u0001'+(cards.length-1)+'\u0001';
  });
  return {text:out,cards};
}
function mdBlock(html){
  if(!html)return html;
  return html
    .replace(/^#{1,4}\s+(.+)$/gm,'<div class="wish-h">$1</div>')
    .replace(/^\s*[-*·]\s+(.+)$/gm,'<div class="wish-li">$1</div>')
    .replace(/^\s*(\d+)\.\s+(.+)$/gm,'<div class="wish-li">$1. $2</div>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>');
}
function richText(raw){
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const {text,cards}=cardify(raw);
  const parts=text.split(/```[a-zA-Z]*\n?/);
  const html=parts.map((chunk,index)=>index%2
    ? '<pre class="wish-code">'+esc(chunk.replace(/\n$/,''))+'</pre>'
    : mdBlock(richLinkify(chunk))).join('');
  return html.replace(/\u0001(\d+)\u0001/g,(_,i)=>cards[Number(i)]||'');
}

async function sendWish(input){
  if(wishPending)return;
  const text=input.value.trim(),kind='chat';
  if(!text)return;
  const context=wishContext;
  input.value='';wishDraft=null;wishPending=true;
  wishMessages.push({role:'user',text});
  const assistant={role:'assistant',text:''};
  wishMessages.push(assistant);drawWish();
  try{
    const request=context?text+'\n\n选中的画布节点（仅接口信息）：'+JSON.stringify(context):text;
    assistant.text=wishLive?
      await wishAgent(request,kind,chunk=>{assistant.text=chunk;drawWish();}):wishDemo(text,kind);
    const canvasPatch=wishPatchFromReply(assistant.text);
    if(canvasPatch){
      if(canvasPatch.preview===true){
        const dryDone=applyWishPatch(canvasPatch);
        if(dryDone&&dryDone.conflict)wishMessages.push({role:'error',text:'画布在你发指令之后改过了（现在 '+dryDone.currentRev+'），这份预览作废，要按现在的样子重算一次吗？'});
        else if(dryDone&&dryDone.touched.length){
          const apply={...canvasPatch};delete apply.preview;
          wishMessages.push({role:'assistant',text:'准备改 '+dryDone.touched.length+' 处：'+dryDone.touched.join('；')+'。确认无误再应用。',applyPatch:apply});
        }else wishMessages.push({role:'error',text:'这份预览没有要改的东西。'});
      }else{
      const done=applyWishPatch(canvasPatch);
      if(done&&done.conflict)wishMessages.push({role:'error',text:'画布在你发指令之后改过了（现在 '+done.currentRev+'），这次补丁没应用，免得覆盖你的改动。要按现在的样子重算一次吗？'});
      else if(done&&done.touched.length)wishMessages.push({role:'assistant',text:'画布已改 '+done.touched.length+' 处：'+done.touched.join('；'),undo:done.flow});
      else if(done)wishMessages.push({role:'error',text:'画布改动没有落到实处：所有节点 id 都没对上。'});
      else wishMessages.push({role:'error',text:'画布改动没有应用：找不到目标流程。'});
      }
    }else if(wishPatchRe.test(assistant.text))wishMessages.push({role:'error',text:'画布改动没有应用：patch 不是合法 JSON。'});
    if(kind!=='chat')wishDraft=wishDraftFromReply(assistant.text,kind);
    if(kind!=='chat'&&!wishDraft)wishMessages.push({role:'error',text:'这次回复没有可用的画布草稿。可以请助手调整后再试。'});
  }catch(error){assistant.role='error';assistant.text=error.message;if(!input.value)input.value=text;}
  finally{wishPending=false;if(wishPanel.hidden)wishUnread++;updateWishLauncher();syncWishContext();drawWish();}
}
function undoWishPatch(index){
  const msg=wishMessages[index];
  if(!msg||!msg.undo)return;
  const flow=flows.find(item=>item.id===msg.undo);
  if(!flow){wishMessages.push({role:'error',text:'这条流程已经不在了，撤不回去。'});drawWish();return;}
  const view=views[flow.id];
  if(!view||!(view.history||[]).length){wishMessages.push({role:'error',text:'撤销栈里没有可退的一步了。'});drawWish();return;}
  travelCanvasHistory(flow,false);
  delete wishDeltas[flow.id];
  delete msg.undo;
  wishMessages.push({role:'assistant',text:'已撤回那次修改。'});
  drawWish();
}
function applyPendingWishPatch(index){
  const msg=wishMessages[index];
  if(!msg||!msg.applyPatch)return;
  const patch=msg.applyPatch;
  delete msg.applyPatch;
  const done=applyWishPatch(patch);
  if(done&&done.conflict)wishMessages.push({role:'error',text:'画布在你确认之前又变过了（现在 '+done.currentRev+'），这次没应用。让我按现在的样子重算一次。'});
  else if(done&&done.touched&&done.touched.length)wishMessages.push({role:'assistant',text:'画布已改 '+done.touched.length+' 处：'+done.touched.join('；'),undo:done.flow});
  else wishMessages.push({role:'error',text:'补丁没碰到任何节点。'});
  drawWish();
}

async function syncFlowsFromHost(options){
  // 功能库和复合功能库只认宿主：宿主有画布快照就整份接管，没有就只留内置示例。
  const silent=!!(options&&options.silent);
  let host=null;
  try{
    const res=await fetch('/plugins/thinking-space/flows?t='+Date.now(),{credentials:'same-origin',cache:'no-store'});
    if(!res.ok)throw new Error('宿主返回 HTTP '+res.status);
    host=await res.json();
  }catch(e){
    console.warn('画布：读宿主快照失败，'+e.message);
    return {ok:false,source:'none',count:0,functionCount:0,compoundCount:0,message:e.message||String(e)};
  }
  const snap=host&&host.ok?host.snapshot:null;
  const next=snap&&snap.project&&Array.isArray(snap.project.flows)?snap.project.flows:[];
  try{
    const prev=localStorage.getItem('robot-workbench-prototype-v4');
    if(prev)localStorage.setItem('robot-workbench-local-backup',JSON.stringify({savedAt:new Date().toISOString(),project:prev}));
  }catch(e){}
  let source;
  if(next.length){
    try{
      localStorage.setItem('robot-workbench-prototype-v4',JSON.stringify(snap.project));
      localStorage.setItem('robot-workbench-prototype-v4-snapshot',JSON.stringify(snap));
    }catch(e){}
    flows=next;
    source='host';
    console.info('画布：按宿主同步 '+next.length+' 条流程');
  }else{
    flows=createFeatureExamples();
    source='examples';
    console.info('画布：宿主没有画布，只留 '+flows.length+' 条示例');
  }
  open=flows.map(flow=>flow.id);
  if(!flows.some(flow=>flow.id===active)&&!libraryTabs.has(active))active=flows[0]?flows[0].id:'library';
  try{render();}catch(e){console.warn('画布：同步后重绘失败 '+e.message);}
  const functionCount=flows.filter(flow=>!flow.compound).length;
  const compoundCount=flows.filter(flow=>flow.compound).length;
  const savedAt=snap&&snap.savedAt?snap.savedAt:null;
  if(!silent)console.info('画布：同步完成 来源='+source+' 共'+flows.length+' 条');
  return {ok:true,source,count:flows.length,functionCount,compoundCount,savedAt};
}

function openFlowById(id,nodeId){

  if(nodeId&&(flow.nodes||[]).some(node=>node.id===nodeId))view.selected=nodeId;
  const nodes=flow.nodes||[];

    const lefts=nodes.map(node=>Number(node.x)||0),tops=nodes.map(node=>Number(node.y)||0);
    const minX=Math.min(...lefts),maxX=Math.max(...lefts)+190;

function injectSkill(raw){
  if(!raw)return false;
  let skill=null;
  try{
    const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    const pad=b64.length%4?b64+'='.repeat(4-b64.length%4):b64;
    const bytes=Uint8Array.from(atob(pad),c=>c.charCodeAt(0));
    skill=JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){console.warn('注入参数解析失败：'+e.message);return false;}
  if(!skill||!Array.isArray(skill.steps)||!skill.steps.length)return false;
  const id='skill-'+(skill.id||Date.now());
  const idx=new Map(skill.steps.map((step,k)=>[step.id,k]));
  const refMap={};
  skill.steps.forEach((step,k)=>{if(step.id!=null)refMap[String(step.id)]='n'+k;});
  const remapRefs=(v)=>{
    if(typeof v==='string'){
      return v.replace(/\$\{([^}.\s]+)\./g,(m,key)=>refMap[key]?('${'+refMap[key]+'.'):m)
              .replace(/\$\{([^}\s]+)\}/g,(m,key)=>refMap[key]?('${'+refMap[key]+'}'):m);
    }
    if(Array.isArray(v))return v.map(remapRefs);
    if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v))o[k]=remapRefs(v[k]);return o;}
    return v;
  };
  const nodes=skill.steps.map((step,k)=>({
    id:'n'+k,type:step.tool,x:36+k*216,y:92+(k%2)*105,params:remapRefs(step.params||{})
  }));
  const edges=[];
  skill.steps.forEach((step,k)=>{
    if(step.next!=null&&idx.has(step.next))edges.push(['n'+k,'n'+idx.get(step.next),'after']);
  });
  const flow={id,name:skill.name||'技能草稿',skillDraft:true,note:'由技能临时注入，保存画布才会留下',nodes,edges};
  const at=flows.findIndex(item=>item.id===id);
  if(at>=0)flows[at]=flow;else flows.push(flow);
  try{
    const url=new URL(location.href);
    url.searchParams.delete('inject');
    url.searchParams.set('flow',id);
    history.replaceState(null,'',url.pathname+(url.search||'')+url.hash);
  }catch{}
  if(typeof openFlowById==='function')openFlowById(id);
  return true;
}
async function openSkillById(id){

    const res=await fetch('/plugins/thinking-space/skill?id='+encodeURIComponent(id),{headers:{accept:'application/json'}});

<script>
(function () {
  const modal = document.getElementById("store-modal");
  if (!modal) return;
  const box = document.getElementById("store-body");
  const GRADS = [
    "linear-gradient(120deg,#c7d6ff,#9fb7ff)",
    "linear-gradient(120deg,#ffe9b8,#f6cf7a)",
    "linear-gradient(120deg,#c8ebd6,#9ed6b6)",
    "linear-gradient(120deg,#e0d4f7,#c6b3ef)",
    "linear-gradient(120deg,#c5e8ee,#9fd5df)",
    "linear-gradient(120deg,#f7d3dc,#eda9b8)"
  ];
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  let loading = false, loaded = false;

  function card(e, i, official, status) {
    const st = status && status[e.id];
    const ver = st ? (st.installed ? st.installedVersion : st.version) : "";
    const isInstalled = !!(st && st.installed);
    const g = GRADS[i % GRADS.length];
    const initials = esc(String(e.name || "?").slice(0, 2));
    const links = [
      e.installation ? '<a href="' + esc(e.installation) + '" target="_blank" rel="noopener noreferrer">安装说明</a>' : "",
      e.repository ? '<a href="' + esc(e.repository) + '" target="_blank" rel="noopener noreferrer">原仓库</a>' : "",
      e.feedback ? '<a href="' + esc(e.feedback) + '" target="_blank" rel="noopener noreferrer">反馈</a>' : ""
    ].join("");
    return '<article class="store-card">' +
      '<div class="store-card-art" style="background:' + g + '"><span>' + initials + '</span></div>' +
      '<div class="store-card-main"><div class="store-card-row"><span class="store-card-name">' + esc(e.name) + "</span>" +
      (official ? '<span class="store-tag official">官方</span>' : "") +
      (ver ? '<span class="store-ver">v' + esc(ver) + "</span>" : "") +
      (st ? (isInstalled ? '<span class="store-state installed">\u2713 已安装</span>' : '<span class="store-state">\u53ef\u5b89\u88c5</span>') : "") + "</div>" +
      '<p class="store-card-desc">' + esc(e.description) + "</p>" +
      '<div class="store-links">' + links + "</div>" + installBtn(e, st) + "</div></article>";
  }

  // 有安装计划就出一个按钮：官方与社区都走同一个 {id, action, planKey} 协议。
  function installBtn(e, st) {
    if (!st || st.installed || !st.action || !st.planKey) return "";
    const label = st.action === "install" ? "安装" : st.action === "update" ? "更新" : st.action === "repair" ? "修复" : st.action;
    return '<button type="button" class="store-install" data-store-install="' + esc(e.id) +
      '" data-store-action="' + esc(String(st.action)) +
      '" data-store-plan="' + esc(String(st.planKey)) +
      '" data-store-kind="' + (st.community ? "community" : "official") + '">' + esc(String(label)) + "</button>";
  }
  function section(title, list, official, status) {

      '<div class="store-grid">' + list.map((e, i) => card(e, i, official, status)).join("") + "</div>";
  }

  // 插件目录：先拉上游最新（跟随 WhaleLife 仓库），拿不到再用本机快照。
const REMOTE_CATALOG = "https://raw.githubusercontent.com/iinukami/whalelife/main/market/catalog.json";
async function fetchCatalog() {
  try {
    const r = await fetch(REMOTE_CATALOG, { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j && (Array.isArray(j.official) || Array.isArray(j.community))) {
        catalogSource = "上游";
        return j;
      }
    }
  } catch (e) { /* 离线或被拦，走本机 */ }
  const r2 = await fetch("/market/catalog.json", { cache: "no-store" });
  if (!r2.ok) throw new Error("HTTP " + r2.status);
  catalogSource = "本机快照";
  return await r2.json();
}
let catalogSource = "";

async function load() {
    if (loaded || loading) return;
    loading = true;
    try {
      const [cat, stateRes] = await Promise.all([
  fetchCatalog(),
  fetch("/api/official-plugins", { cache: "no-store", credentials: "same-origin" }).catch(() => null),
]);
      let status = null;
      try {
        if (stateRes && stateRes.ok) {
          const j = await stateRes.json();
          status = {};
          for (const item of j.plugins || []) status[item.id] = item;
        }
      } catch { status = null; }
      try {
        const cRes = await fetch("/api/community-plugins", { cache: "no-store", credentials: "same-origin" });
        if (cRes.ok) {
          const cj = await cRes.json();
          if (!status) status = {};
          for (const item of cj.plugins || []) { item.community = true; status[item.id] = item; }
        }
      } catch (e) { /* 社区目录拿不到就不出安装按钮，不影响看目录 */ }
      const out = section("官方插件", cat.official, true, status) + section("社区插件", cat.community, false, status);
      box.innerHTML = out || '<p class="store-msg">插件目录是空的。</p>';

    } catch (err) {
      box.innerHTML = '<p class="store-msg">读不到插件目录（' + esc(err && err.message ? err.message : "未知错误") + "）。确认 WhaleLife 宿主在运行，再点一次按钮可重试。</p>";
    } finally {
      loading = false;
    }
  }

  function open() {

    const back = modal.querySelector(".store-back");
    if (back) back.focus();
  }
  function close() { if (modal.open) modal.close(); else modal.removeAttribute("open"); }

  document.addEventListener("click", (ev) => {
    const opener = ev.target.closest && ev.target.closest("[data-store-open]");

      }).then(() => {

        box.innerHTML = '<p class="store-msg">装好了，正在刷新目录…</p>';
        return load();
      }).catch((err) => {
        inst.disabled = false;
        inst.textContent = "安装";
        box.insertAdjacentHTML("afterbegin", '<p class="store-msg">' + esc(err && err.message ? err.message : "安装失败") + "</p>");
      });
      return;
    }
    const submit = ev.target.closest && ev.target.closest("[data-store-submit]");
    if (submit) {
      ev.preventDefault();
      window.open("https://github.com/iinukami/whalelife/issues/new?template=submit-plugin.yml", "_blank", "noopener,noreferrer");
      return;

    const closer = ev.target.closest && ev.target.closest("[data-store-close]");
    if (closer) { ev.preventDefault(); close(); }
  });
  modal.addEventListener("click", (ev) => { if (ev.target === modal) close(); });

  // ---- 拖拽与拉伸 ----
  const GEO_KEY = "robot-store-geo";
  function readGeo() {
    try {
      const raw = localStorage.getItem(GEO_KEY);
      if (!raw) return null;
      const g = JSON.parse(raw);
      const ok = ["left", "top", "width", "height"].every((k) => Number.isFinite(g && g[k]));
      if (!ok) return null;
      if (g.width < 200 || g.height < 160) return null;
      return g;
    } catch { return null; }
  }
  function saveGeo() {
    if (!modal.open || !modal.style.left) return;
    try {
      localStorage.setItem(GEO_KEY, JSON.stringify({
        left: parseFloat(modal.style.left) || 0,
        top: parseFloat(modal.style.top) || 0,
        width: modal.offsetWidth,
        height: modal.offsetHeight,
      }));
    } catch { /* 存不下就算了，不影响使用 */ }
  }
  function applyGeometry() {
    resetGeometry();
    const g = readGeo();
    if (!g) return;
    modal.style.margin = "0";
    modal.style.right = "auto";
    modal.style.bottom = "auto";
    modal.style.maxWidth = "none";
    modal.style.maxHeight = "none";
    modal.style.width = Math.min(g.width, innerWidth - 16) + "px";
    modal.style.height = Math.min(g.height, innerHeight - 16) + "px";
    modal.style.left = Math.max(8 - g.width + 120, Math.min(g.left, innerWidth - 120)) + "px";
    modal.style.top = Math.max(0, Math.min(g.top, innerHeight - 44)) + "px";
  }
  function resetGeometry() {
    for (const k of ["left", "top", "right", "bottom", "width", "height"]) modal.style[k] = "";

  }
  function lockGeometry() {
    const r = modal.getBoundingClientRect();

    modal.style.top = r.top + "px";
    modal.style.width = r.width + "px";
    modal.style.height = r.height + "px";
    modal.style.maxWidth = "none";

  }

  }

  const head = modal.querySelector(".store-head");
  if (head) {
    head.addEventListener("pointerdown", (ev) => {

      }, () => { head.classList.remove("store-dragging"); saveGeo(); });

  }

  const shell = modal.querySelector(".store-shell");
  if (shell) {
    const grip = document.createElement("div");
    grip.className = "store-resize";
    grip.setAttribute("role", "separator");
    grip.setAttribute("aria-label", "拖动调整窗口大小");

      }, () => saveGeo());
      ev.preventDefault();
      ev.stopPropagation();
    });
  }
  window.addEventListener("resize", () => {
    if (!modal.open || !modal.style.left) return;
    setTimeout(saveGeo, 0);
    modal.style.left = clamp(parseFloat(modal.style.left), 8 - modal.offsetWidth + 120, innerWidth - 120) + "px";
    modal.style.top = clamp(parseFloat(modal.style.top), 0, innerHeight - 44) + "px";
  });
})();
</script>
<script>
(function(){
  window.__PERSONA='助手';
  var records=[];
  function collect(){
    if(records.length) return;
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;
    while((n=w.nextNode())) if(n.nodeValue.indexOf('__PERSONA__')>=0) records.push({t:'text',node:n,raw:n.nodeValue});
    document.querySelectorAll('*').forEach(function(el){
      for(var i=0;i<el.attributes.length;i++){var a=el.attributes[i];if(a.value.indexOf('__PERSONA__')>=0) records.push({t:'attr',el:el,name:a.name,raw:a.value});}
    });
    if(document.title.indexOf('__PERSONA__')>=0) records.push({t:'title',raw:document.title});
  }
  function render(){
    var nm=window.__PERSONA;
    records.forEach(function(r){
      var v=r.raw.split('__PERSONA__').join(nm);
      if(r.t==='text') r.node.nodeValue=v;
      else if(r.t==='attr') r.el.setAttribute(r.name,v);
      else document.title=v;
    });
  }
  function boot(){
    collect();render();
    try{
      fetch('/api/status',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
        if(!d||!d.personaName) return;
        var nm=String(d.personaName).replace(/[（(][^）)]*[）)]/g,'').trim();
        if(!nm) return;
        window.__PERSONA=nm;render();
      }).catch(function(){});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
</body><script>
(function(){
  var KEY='robot-workbench-prototype-v4';
  var SNAP=KEY+'-snapshot';
  var FLAG='robot-flows-hydrated';
  var URL='/plugins/thinking-space/flows';

  window.syncProjectToServer=function(snapshot){
    try{
      fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({snapshot:snapshot})})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){ if(d&&d.ok){ if(window.noteServerWrite) window.noteServerWrite(d.savedAt); console.info('工程已同步到服务端',d.savedAt); } })
        .catch(function(){});
    }catch(e){}
  };

  function localSavedAt(){
    try{
      var raw=localStorage.getItem(SNAP);
      if(!raw) return '';
      var o=JSON.parse(raw);
      return typeof o.savedAt==='string'?o.savedAt:'';
    }catch(e){ return ''; }
  }

  function hydrate(){
    if(sessionStorage.getItem(FLAG)==='1') return;
    sessionStorage.setItem(FLAG,'1');
    try{
      fetch(URL,{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
        if(!d||!d.ok||!d.snapshot||!d.savedAt) return;
        var fl=(d.snapshot.project&&d.snapshot.project.flows)||[];
        if(!fl.length) return;   /* 服务端是空的，不要覆盖本地画布 */
        var mine=localSavedAt();
        if(mine && mine>=d.savedAt) return;
        localStorage.setItem(SNAP,JSON.stringify(d.snapshot));
        if(d.snapshot.project) localStorage.setItem(KEY,JSON.stringify(d.snapshot.project));
        console.info('从服务端载入工程',d.savedAt);
        location.reload();
      }).catch(function(){});
    }catch(e){}
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hydrate);
  else hydrate();
})();
</script>
</html>
